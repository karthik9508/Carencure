<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery | Carencure Pest Control</title>
  <script type="module" src="./src/main.js"></script>
</head>
<body class="flex flex-col min-h-screen">
  <header class="bg-white shadow-sm sticky top-0 z-50">
    <div class="container-custom py-4 flex justify-between items-center">
      <a href="/" class="text-2xl font-poppins font-bold text-primary">Carencure</a>
      <nav class="hidden md:flex gap-6 items-center">
        <a href="index.html" class="text-gray-600 hover:text-primary transition-colors">Home</a>
        <a href="about.html" class="text-gray-600 hover:text-primary transition-colors">About Us</a>
        <a href="services.html" class="text-gray-600 hover:text-primary transition-colors">Services</a>
        <a href="certificates.html" class="text-gray-600 hover:text-primary transition-colors">Certificates</a>
        <a href="gallery.html" class="text-primary font-medium transition-colors">Gallery</a>
        <a href="contact.html" class="text-gray-600 hover:text-primary transition-colors">Contact</a>
      </nav>
    </div>
  </header>
  <main class="flex-grow pb-16 md:pb-0">
    <section class="bg-primary text-white py-16 md:py-24 text-center">
      <div class="container-custom">
        <h1 class="text-4xl md:text-5xl font-bold mb-4">Our <span class="text-secondary">Gallery</span></h1>
        <p class="text-xl text-gray-200 max-w-2xl mx-auto">Explore our projects and see the CarenCure team in action.</p>
      </div>
    </section>

    <section class="section-padding bg-gray-50">
      <div class="container-custom">
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
          <!-- Image 1 -->
          <div class="group relative overflow-hidden rounded-2xl shadow-sm hover:shadow-xl transition-shadow duration-300">
            <img src="./Gallery/1.jfif" alt="CarenCure Gallery 1" class="w-full h-72 object-cover group-hover:scale-110 transition-transform duration-500">
            <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
              <span class="text-white font-medium text-lg tracking-wide border-b-2 border-secondary pb-1">View Full</span>
            </div>
          </div>
          <!-- Image 2 -->
          <div class="group relative overflow-hidden rounded-2xl shadow-sm hover:shadow-xl transition-shadow duration-300">
            <img src="./Gallery/2.jfif" alt="CarenCure Gallery 2" class="w-full h-72 object-cover group-hover:scale-110 transition-transform duration-500">
            <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
              <span class="text-white font-medium text-lg tracking-wide border-b-2 border-secondary pb-1">View Full</span>
            </div>
          </div>
          <!-- Image 3 -->
          <div class="group relative overflow-hidden rounded-2xl shadow-sm hover:shadow-xl transition-shadow duration-300">
            <img src="./Gallery/3.jfif" alt="CarenCure Gallery 3" class="w-full h-72 object-cover group-hover:scale-110 transition-transform duration-500">
            <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
              <span class="text-white font-medium text-lg tracking-wide border-b-2 border-secondary pb-1">View Full</span>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="bg-gray-900 text-gray-300 pt-16 pb-8 border-t border-gray-800">
     <div class="container-custom text-center">
       <p>&copy; 2026 CarenCure Pest Control Services. All rights reserved.</p>
     </div>
  </footer>
</body>
</html>
