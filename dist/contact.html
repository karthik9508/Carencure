<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us | Carencure Pest Control</title>
  <script type="module" crossorigin src="/assets/main-5JM5pyno.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/main-DFhKTMCA.css">
</head>
<body class="flex flex-col min-h-screen">
  <!-- Header -->
  <header class="bg-white shadow-sm sticky top-0 z-50">
    <div class="container-custom py-4 flex justify-between items-center">
      <a href="/" class="text-2xl font-poppins font-bold text-primary flex items-center gap-2">Carencure</a>
      <nav class="hidden md:flex gap-6 items-center">
        <a href="index.html" class="text-gray-600 hover:text-primary">Home</a>
        <a href="about.html" class="text-gray-600 hover:text-primary">About Us</a>
        <a href="services.html" class="text-gray-600 hover:text-primary">Services</a>
        <a href="contact.html" class="text-primary font-medium">Contact</a>
      </nav>
      <div class="hidden md:block"><a href="tel:+1234567890" class="btn-primary">Call Now</a></div>
    </div>
  </header>

  <main class="flex-grow pb-16 md:pb-0">
    <section class="bg-primary text-white py-16 md:py-24 text-center">
      <div class="container-custom">
        <h1 class="text-4xl md:text-5xl font-bold mb-4 text-white">Contact <span class="text-secondary">Us</span></h1>
      </div>
    </section>
    
    <section class="section-padding bg-white">
      <div class="container-custom max-w-4xl mx-auto">
        <form class="contact-form space-y-4 bg-gray-50 p-8 rounded-xl shadow-sm">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
              <input type="text" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-primary focus:border-primary">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
              <input type="tel" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-primary focus:border-primary">
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Message</label>
            <textarea rows="4" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-primary focus:border-primary"></textarea>
          </div>
          <button type="submit" class="w-full btn-primary text-center">Send Message</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="bg-gray-900 text-gray-300 py-8 text-center border-t border-gray-800">
    <p>&copy; 2026 Carencure Pest Control Services.</p>
  </footer>
</body>
</html>
